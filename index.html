<div class="grid" style="margin-top:22px">${D.map((x,i)=>{const c='';const k=CL[i];return `<a class="card st ${c}" style="--c:${k[0]};--b:${k[1]}" href="#/${x.n}"><span class="num">${ar(x.n)}</span><img src="card-${x.n}.jpg" alt=""><div class="lab"><h3>${x.short}</h3></div></a>`}).join('')}</div>`;scrollTo(0,0)}
function step(n,tab){document.body.classList.add('stp');document.getElementById('top').innerHTML='';const x=D[n-1];if(!x)return home();tab=tab||'video';const d=S.get(),was=d.includes(n);
const body=tab==='video'?`<div class="vp"><video preload="none" playsinline poster="poster-${n}.jpg" src="${x.video}" onclick="vt(this)"></video><div class="vc"><button class="vb" onclick="vt(this.closest('.vp').querySelector('video'))"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M7 4v16l13-8z" fill="currentColor"/></svg></button><input class="vr" type="range" min="0" max="1000" value="0"><span class="vt">٠:٠٠</span><button class="vf" onclick="vfs(this)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>تكبير</span></button></div></div>`
:tab==='mob'&&x.mob?`<div class="mobs">${x.mob.map((y,k)=>`<figure><div class="t"><span class="n">${ar(k+1)}</span><p>${y.text}</p></div><img loading="lazy" decoding="async" width="451" height="976" src="${y.img}" alt=""></figure>`).join('')}</div>`
:tab==='pics'?`<div class="shots">${x.steps.map((y,k)=>`<div><div class="t"><span class="n">${ar(k+1)}</span><p>${y.text}</p></div><img loading="lazy" decoding="async" width="1400" height="678" src="${y.img}" alt=""></div>`).join('')}</div>`
:`<ol class="list">${x.full.map((y,k)=>`<li><span class="n">${ar(k+1)}</span><span>${y}</span></li>`).join('')}</ol>`;
app.innerHTML=`<a class="back home-btn" href="#/"><span class="ha">→</span>جميع الخطوات</a><div class="shead"><h1 class="stitle" style="margin:2px 0 4px;color:var(--navy);font-size:clamp(24px,5.5vw,32px);line-height:1.3"><span class="snum" style="--b:${CL[n-1][1]}">${ar(n)}</span><span class="tt">${x.title}</span></h1><span></span></div>
<div class="tabs">${[['video','فيديو'],['pics','بالصور'],['text','خطوات']].concat(x.mob?[['mob','الجوال']]:[]).map(([k,t])=>`<button class="${k===tab?'on':''}" onclick="location.hash='#/${n}/${k}'"><span class="ti">${TI[k]}</span>${t}</button>`).join('')}</div>
<div class="card pane">${body}</div>
<div class="nav"><a class="btn ${n>1?'':'dis'}" href="#/${n-1}">→ السابقة</a><span style="flex:1"></span><a class="btn ${n<D.length?'':'dis'}" href="#/${n+1}">التالية ←</a></div>`;scrollTo(0,0)}
function done(n){const d=S.get();if(!d.includes(n))d.push(n);S.set(d);toast(d.length===D.length?'أُنجزت الخطوات جميعها':'تم حفظ الإنجاز');setTimeout(()=>location.hash=n<D.length?'#/'+(n+1):'#/',700)}

const IC={p:'<svg viewBox="0 0 24 24" width="16" height="16"><path d="M7 4v16l13-8z" fill="currentColor"/></svg>',z:'<svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></svg>',r:'<svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" fill="currentColor"/></svg>'};
function fm(t){t=Math.floor(t||0);return ar(Math.floor(t/60))+':'+ar(String(t%60).padStart(2,'0'))}
function vt(v){v.paused?v.play():v.pause()}
function vfs(b){const p=b.closest('.vp'),v=p.querySelector('video');
const L=t=>{const x=b.querySelector('span');if(x)x.textContent=t};
if(p.classList.contains('fake')){p.classList.remove('fake');document.body.style.overflow='';L('تكبير');return}
if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
const fake=()=>{p.classList.add('fake');document.body.style.overflow='hidden';L('تصغير')};
if(document.fullscreenEnabled&&p.requestFullscreen){p.requestFullscreen().then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(fake);return}
if(v.webkitEnterFullscreen){try{if(v.readyState<1){v.play().catch(()=>{})}v.webkitEnterFullscreen();return}catch(e){}}
fake()}
document.addEventListener('fullscreenchange',()=>{document.querySelectorAll('.vf span').forEach(x=>x.textContent=document.fullscreenElement?'تصغير':'تكبير')});
function vinit(){const p=document.querySelector('.vp');if(!p)return;const v=p.querySelector('video'),r=p.querySelector('.vr'),b=p.querySelector('.vb'),t=p.querySelector('.vt');
const up=()=>{r.value=v.duration?v.currentTime/v.duration*1000:0;t.innerHTML='<b>'+fm(v.currentTime)+'</b><i>/</i><b>'+fm(v.duration)+'</b>'};
v.addEventListener('timeupdate',up);v.addEventListener('loadedmetadata',up);v.addEventListener('play',()=>b.innerHTML=IC.z);v.addEventListener('pause',()=>b.innerHTML=IC.p);v.addEventListener('ended',()=>b.innerHTML=IC.r);
r.addEventListener('input',()=>{if(v.duration)v.currentTime=r.value/1000*v.duration})}
function route(){const p=location.hash.replace(/^#\/?/,'').split('/');p[0]?step(+p[0],p[1]):home()}
addEventListener('hashchange',()=>{route();vinit()});route();vinit();
</script></body></html>
