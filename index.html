<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دليل الطالب | سيرتك</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#2b2d84;--pink:#d63384;--yellow:#f7c948;--green:#2bb673;--lav:#f4f1ff;--ink:#1d1f3d;--muted:#6a6d8f;--line:#e6e2fb;--sh:0 4px 18px rgba(43,45,132,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Tajawal,sans-serif;color:var(--ink);background:var(--lav);line-height:1.7}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
header{background:#fff;box-shadow:var(--sh)}
.bar{max-width:820px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:21px;color:var(--navy)}
.bars{display:flex;gap:3px;height:22px}.bars i{width:5px;border-radius:3px}
.bars i:nth-child(1){background:var(--pink)}.bars i:nth-child(2){background:var(--yellow)}.bars i:nth-child(3){background:var(--green)}.bars i:nth-child(4){background:var(--navy)}
.bar small{color:var(--muted);font-weight:500}
main{max-width:820px;margin:auto;padding:24px 16px 48px}
.hero h1{margin:0;color:var(--navy);font-size:clamp(26px,6vw,36px);line-height:1.3}
.hero p{margin:6px 0 0;color:var(--muted);font-size:17px}
.card{background:#fff;border-radius:20px;box-shadow:var(--sh)}
.prog{padding:18px 20px;margin:22px 0}
.prog .row{display:flex;justify-content:space-between;align-items:baseline}
.prog b{color:var(--navy);font-size:17px}.prog .num{color:var(--pink);font-weight:800;font-size:20px}
.track{height:10px;background:var(--lav);border-radius:99px;margin:10px 0 6px;overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#5fd39a);border-radius:99px;transition:.4s}
.prog small{color:var(--muted)}
h2.sec{color:var(--navy);font-size:20px;margin:28px 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.st{position:relative;padding:18px 14px 14px;display:flex;flex-direction:column;gap:6px;border:2px solid transparent;transition:.15s}
.st:hover{transform:translateY(-2px);border-color:var(--line)}
.st .k{width:42px;height:42px;border-radius:12px;background:var(--lav);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:20px}
.st h3{margin:4px 0 0;font-size:16px;color:var(--navy);line-height:1.4}
.st .s{font-size:13px;color:var(--muted);font-weight:700}
.st.done .k{background:var(--green);color:#fff}.st.done .s{color:var(--green)}
.st.cur{border-color:var(--pink)}.st.cur .k{background:var(--pink);color:#fff}.st.cur .s{color:var(--pink)}
.st .badge{position:absolute;top:10px;inset-inline-end:10px;background:var(--yellow);color:var(--navy);font-size:12px;font-weight:800;padding:1px 10px;border-radius:99px}
footer{text-align:center;color:var(--muted);font-size:14px;padding:20px}
.back{display:inline-block;color:var(--navy);font-weight:700;margin-bottom:14px}
.lbl{color:var(--pink);font-weight:800;font-size:15px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#fff;padding:6px;border-radius:16px;box-shadow:var(--sh);margin:18px 0 14px}
.tabs button{border:0;background:none;padding:10px 4px;border-radius:12px;font-weight:800;color:var(--navy);font-size:16px}
.tabs button.on{background:var(--navy);color:#fff}
.pane{padding:14px}
video{width:100%;display:block;border-radius:12px;background:#000}
.shots{display:flex;flex-direction:column;gap:22px}
.t{display:flex;gap:10px;align-items:flex-start}.t p{margin:0;font-size:17px}
.n{flex:none;width:28px;height:28px;margin-top:2px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.shots img{width:100%;display:block;border-radius:12px;border:1px solid var(--line);margin-top:10px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.list li{display:flex;gap:10px;padding:10px 12px;background:var(--lav);border-radius:12px;font-size:17px}
.nav{display:flex;gap:8px;margin-top:18px;align-items:center}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;font-size:15px;background:#fff;color:var(--navy);box-shadow:var(--sh);text-align:center}
.btn.ok{flex:1;background:var(--green);color:#fff}.btn.ok.was{background:#e7f8ef;color:var(--green)}
.btn.dis{opacity:.4;pointer-events:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 20px;border-radius:99px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>

شاركُ في اللقاء. بعدَ دخولِك، تظهرُ أدواتُ اللقاءِ في أعلى الشاشة."}, {"img": "img-6-2.jpg", "text": "لتشغيلِ الميكروفون، اضغطْ على زرِّ Mic."}, {"img": "img-6-3.jpg", "text": "فيتحوّلُ الرمزُ من مشطوبٍ إلى مفتوح. اضغطْ عليه مرّةً أخرى لإغلاقِه."}, {"img": "img-6-4.jpg", "text": "أبقِ الميكروفونَ مغلقًا حتى يطلبَ منكَ معلّمُكَ الحديث."}, {"img": "img-6-5.jpg", "text": "وبالطريقةِ نفسِها، اضغطْ على زرِّ Camera لتشغيلِ الكاميرا أو إغلاقِها."}, {"img": "img-6-6.jpg", "text": "إذا أردتَ أن تتكلّمَ أو تسأل، اضغطْ Raise لرفعِ يدِك، فيظهرُ خطٌّ تحتَ الزرّ."}, {"img": "img-6-7.jpg", "text": "وعندما تنتهي، اضغطْ عليه مرّةً أخرى لتُنزلَ يدَك."}, {"img": "img-6-8.jpg", "text": "ومن React تتفاعلُ مع معلّمِكَ وزملائِكَ بالرموز."}, {"img": "img-6-9.jpg", "text": "ومن Chat تكتبُ رسائلَك، وتجدُ الروابطَ التي يرسلُها معلّمُك."}, {"img": "img-6-10.jpg", "text": "وعندما يرسلُ معلّمُكَ رابطَ نشاطٍ تفاعليّ، اضغطْ على الرابطِ ليفتحَ النشاطُ في المتصفّح."}, {"img": "img-6-11.jpg", "text": "وعندَ انتهاءِ اللقاء، اضغطْ Leave للخروج."}], "desc": "كيفية الانضمام إلى اللقاء والمشاركة فيه.", "short": "المشاركة في اللقاء"}, {"n": 7, "slug": "wordwall", "title": "حل نشاط Wordwall", "video": "video-7-wordwall.mp4", "steps": [{"img": "img-7-1.jpg", "text": "لنتعلّمْ معًا كيفَ نحلُّ نشاطَ Wordwall. عندما يرسلُ معلّمُكَ رابطَ النشاط، اضغطْ عليه."}, {"img": "img-7-2.jpg", "text": "اكتبِ اسمَكَ في المربّع، ثمّ اضغطِ «البدء»."}, {"img": "img-7-3.jpg", "text": "اضغطْ زرَّ البدءِ مرّةً أخرى لتبدأَ النشاط."}, {"img": "img-7-4.jpg", "text": "حُلَّ النشاطَ باتّباعِ التعليمات، ثمّ اضغطْ «إرسال الإجابات»."}, {"img": "img-7-5.jpg", "text": "تظهرُ لكَ إجاباتُكَ الصحيحةُ والخاطئة، وتصلُ نتيجتُكَ إلى معلّمِك."}], "desc": "كيفية فتح نشاط Wordwall وحلّه.", "short": "نشاط Wordwall"}, {"n": 8, "slug": "forms", "title": "حل اختبار Microsoft Forms", "video": "video-8-forms.mp4", "steps": [{"img": "img-8-1.jpg", "text": "لنتعلّمْ معًا كيفَ نحلُّ اختبارَ Microsoft Forms. عندما يرسلُ معلّمُكَ رابطَ الاختبار، اضغطْ عليه."}, {"img": "img-8-2.jpg", "text": "يفتحُ الاختبار. اكتبِ اسمَكَ في السؤالِ الأوّل."}, {"img": "img-8-3.jpg", "text": "أجبْ عن كلِّ الأسئلة، والأسئلةُ التي عليها نجمةٌ حمراءُ مطلوبة."}, {"img": "img-8-4.jpg", "text": "بعدَ أن تنتهي، اضغطْ «إرسال» لتسليمِ الاختبارِ إلى معلّمِك."}], "desc": "كيفية فتح اختبار Microsoft Forms والإجابة عنه.", "short": "اختبار Forms"}];
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const S={get(){try{return JSON.parse(localStorage.getItem('seratac-done')||'[]')}catch(e){return[]}},set(v){try{localStorage.setItem('seratac-done',JSON.stringify(v))}catch(e){}}};
const app=document.getElementById('app');
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function home(){const d=S.get();const cur=(D.find(x=>!d.includes(x.n))||{}).n;
app.innerHTML=`<div class="hero"><h1>دليل استخدام Teams وvschool</h1><p>يوضّح هذا الدليل خطوات استخدام Microsoft Teams ومنصة vschool بالفيديو والصور والشرح المكتوب.</p></div>
<div class="card prog"><div class="row"><b>التقدّم</b><span class="num">${ar(d.length)} من ${ar(D.length)}</span></div><div class="track"><i style="width:${d.length/D.length*100}%"></i></div><small>${d.length===D.length?'أُنجزت الخطوات جميعها.':'أكمل الخطوات بالترتيب.'}</small></div>
<h2 class="sec">الخطوات</h2><div class="grid">${D.map(x=>{const c=d.includes(x.n)?'done':x.n===cur?'cur':'';return `<a class="card st ${c}" href="#/${x.n}">${c==='cur'?'<span class="badge">ابدأ هنا</span>':''}<span class="k">${c==='done'?'✓':ar(x.n)}</span><h3>${x.short}</h3><span class="s">${c==='done'?'تم الإنجاز':c==='cur'?'الخطوة الحالية':'لم تبدأ بعد'}</span></a>`}).join('')}</div>`;scrollTo(0,0)}
function step(n,tab){const x=D[n-1];if(!x)return home();tab=tab||'video';const d=S.get(),was=d.includes(n);
const body=tab==='video'?`<video controls preload="metadata" playsinline src="${x.video}"></video>`
:tab==='pics'?`<div class="shots">${x.steps.map((y,k)=>`<div><div class="t"><span class="n">${ar(k+1)}</span><p>${y.text}</p></div><img loading="lazy" src="${y.img}" alt=""></div>`).join('')}</div>`
:`<ol class="list">${x.steps.map((y,k)=>`<li><span class="n">${ar(k+1)}</span><span>${y.text}</span></li>`).join('')}</ol>`;
app.innerHTML=`<a class="back" href="#/">→ جميع الخطوات</a><div class="lbl">الخطوة ${ar(n)} من ${ar(D.length)}</div><h1 style="margin:2px 0 4px;color:var(--navy);font-size:clamp(24px,5.5vw,32px);line-height:1.3">${x.title}</h1><p style="margin:0;color:var(--muted)">${x.desc}</p>
<div class="tabs">${[['video','فيديو'],['pics','بالصور'],['text','خطوات']].map(([k,t])=>`<button class="${k===tab?'on':''}" onclick="location.hash='#/${n}/${k}'">${t}</button>`).join('')}</div>
<div class="card pane">${body}</div>
<div class="nav"><a class="btn ${n>1?'':'dis'}" href="#/${n-1}">→ السابقة</a><button class="btn ok ${was?'was':''}" onclick="done(${n})">${was?'✓ تم الإنجاز':'أنجزتُ الخطوة'}</button><a class="btn ${n<D.length?'':'dis'}" href="#/${n+1}">التالية ←</a></div>`;scrollTo(0,0)}
function done(n){const d=S.get();if(!d.includes(n))d.push(n);S.set(d);toast(d.length===D.length?'أُنجزت الخطوات جميعها':'تم حفظ الإنجاز');setTimeout(()=>location.hash=n<D.length?'#/'+(n+1):'#/',700)}
function route(){const p=location.hash.replace(/^#\/?/,'').split('/');p[0]?step(+p[0],p[1]):home()}
addEventListener('hashchange',route);route();
</script></body></html>
