<style>
:root{--navy:#2b2d84;--pink:#d63384;--yellow:#f7c948;--green:#2bb673;--lav:#f4f1ff;--ink:#1d1f3d;--muted:#6a6d8f}
*{box-sizing:border-box}body{margin:0;font-family:Tajawal,sans-serif;color:var(--ink);background:var(--lav);overflow-x:hidden}
a{color:inherit;text-decoration:none}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.35;z-index:-1}
.b1{width:320px;height:320px;background:var(--pink);top:-80px;left:-80px}.b2{width:280px;height:280px;background:var(--yellow);bottom:10%;right:-90px}.b3{width:240px;height:240px;background:var(--green);top:40%;left:-120px}
header{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:24px;color:var(--navy)}
.bars{display:flex;gap:3px;height:26px}.bars i{width:6px;border-radius:3px}
.bars i:nth-child(1){background:var(--pink)}.bars i:nth-child(2){background:var(--yellow)}.bars i:nth-child(3){background:var(--green)}.bars i:nth-child(4){background:var(--navy)}
.prog{font-weight:800;color:var(--navy);background:#fff;padding:8px 14px;border-radius:999px;box-shadow:0 4px 0 #e2dcff}
main{max-width:900px;margin:auto;padding:0 16px 60px}
.hero{text-align:center;padding:10px 0 20px}
.hero .hi{font-size:56px;display:inline-block;animation:wave 2s infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}20%{transform:rotate(18deg)}40%{transform:rotate(-10deg)}}
.hero h1{font-size:clamp(32px,7vw,56px);margin:4px 0;color:var(--navy);font-weight:900;line-height:1.2}
.hero h1 em{font-style:normal;color:var(--pink);position:relative}
.hero h1 em:after{content:"";position:absolute;inset:auto 0 4px 0;height:12px;background:var(--yellow);z-index:-1;border-radius:6px}
.hero p{color:var(--muted);font-size:18px;margin:6px 0 0}
.road{position:relative;margin:30px auto 0;max-width:640px}
.road svg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.stop{position:relative;z-index:1;display:flex;align-items:center;gap:14px;width:78%;margin-bottom:26px;background:#fff;border-radius:24px;padding:14px 16px;box-shadow:0 6px 0 #e2dcff;transition:.2s}
.stop:nth-child(odd){margin-inline-start:auto}
.stop:hover{transform:translateY(-3px) rotate(-.5deg)}
.dot{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:26px;color:#fff;position:relative;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15)}
.dot b{position:absolute;top:-6px;inset-inline-end:-6px;background:var(--navy);color:#fff;font-size:13px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff}
.stop h3{margin:0;font-size:clamp(16px,4vw,20px);color:var(--navy)}
.stop small{color:var(--muted)}
.stop.done{background:#eafff4}.stop.done .dot:after{content:"✓";position:absolute;bottom:-4px;inset-inline-start:-4px;background:var(--green);color:#fff;font-size:14px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff}
.flag{text-align:center;font-size:44px;margin-top:-6px}
.back{display:inline-flex;gap:6px;align-items:center;font-weight:700;color:var(--navy);margin:6px 0 14px}
.title{display:flex;align-items:center;gap:14px;margin-bottom:16px}.title h2{margin:0;font-size:clamp(22px,5vw,34px);color:var(--navy);font-weight:900}
.switch{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;max-width:520px}
.switch button{font:inherit;font-weight:800;font-size:clamp(14px,3.8vw,17px);border:0;border-radius:16px;padding:12px 4px;background:#fff;color:var(--navy);box-shadow:0 4px 0 #e2dcff;cursor:pointer}
.switch button.on{background:var(--navy);color:#fff;box-shadow:0 4px 0 #15165a;transform:translateY(-2px)}
.card{background:#fff;border-radius:26px;padding:14px;box-shadow:0 8px 0 #e2dcff}
video{width:100%;border-radius:18px;display:block;background:#000}
.shots{display:flex;flex-direction:column;gap:20px}
.shot{position:relative}
.shot img{width:100%;border-radius:18px;display:block;border:3px solid var(--lav)}
.shot p{margin:-14px 12px 0;position:relative;background:var(--navy);color:#fff;border-radius:16px;padding:12px 14px;font-size:17px;line-height:1.7;display:flex;gap:10px}
.n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-weight:800}
.list{list-style:none;margin:0;padding:6px;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.list li{display:flex;gap:12px;align-items:flex-start;font-size:18px;line-height:1.8;padding:12px;border-radius:16px;background:var(--lav)}
.tools{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn{font:inherit;font-weight:800;border:0;border-radius:999px;padding:12px 18px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.ok{background:var(--green);color:#fff}.pr{background:#fff;color:var(--navy)}
.pager{display:flex;justify-content:space-between;margin-top:20px;gap:10px}
.pager a{background:#fff;padding:12px 18px;border-radius:999px;font-weight:800;color:var(--navy);box-shadow:0 4px 0 #e2dcff}
.pager a.nx{background:var(--pink);color:#fff;box-shadow:0 4px 0 #a51f62}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:560px){.stop{width:100%}.road svg{display:none}}
@media print{header,.switch,.tools,.pager,.blob{display:none}.card{box-shadow:none}}

requestAnimationFrame(drawRoad);scrollTo(0,0);prog()}
function drawRoad(){const r=document.getElementById('road');if(!r)return;const st=[...r.querySelectorAll('.dot')];const rb=r.getBoundingClientRect();
const pts=st.map(d=>{const b=d.getBoundingClientRect();return[b.left-rb.left+b.width/2,b.top-rb.top+b.height/2]});
let p=`M${pts[0][0]},${pts[0][1]}`;for(let i=1;i<pts.length;i++){const[a,b]=pts[i-1],[c,d]=pts[i];p+=` C${a},${(b+d)/2} ${c},${(b+d)/2} ${c},${d}`}
r.insertAdjacentHTML('afterbegin',`<svg viewBox="0 0 ${rb.width} ${rb.height}" preserveAspectRatio="none"><path d="${p}" fill="none" stroke="#c9bfff" stroke-width="6" stroke-dasharray="2 14" stroke-linecap="round"/></svg>`)}

:tab==='pics'?`<div class="shots">${s.steps.map((x,k)=>`<figure class="shot" style="margin:0"><img loading="lazy" src="${x.img}" alt=""><p><span class="n">${ar(k+1)}</span><span>${x.text}</span></p></figure>`).join('')}</div>`
:`<ol class="list">${s.steps.map((x,k)=>`<li><span class="n">${ar(k+1)}</span><span>${x.text}</span></li>`).join('')}</ol>`;
app.innerHTML=`<a class="back" href="#/">→ خريطةُ الرحلة</a>
<div class="title"><span class="dot" style="background:${M[i][1]}">${M[i][0]}<b>${ar(n)}</b></span><h2>${s.title}</h2></div>
<div class="switch">${[['video','🎬 فيديو'],['pics','🖼️ صور'],['text','📝 خطوات']].map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="location.hash='#/${n}/${k}'">${l}</button>`).join('')}</div>
<div class="card">${body}<div class="tools"><button class="btn ok" onclick="done(${n})">✓ أنهيتُ هذه المحطّة</button>${tab==='text'?'<button class="btn pr" onclick="print()">🖨️ اطبع</button>':''}</div></div>
<div class="pager">${n>1?`<a href="#/${n-1}">→ السابقة</a>`:'<span></span>'}${n<D.length?`<a class="nx" href="#/${n+1}">المحطّة التالية ←</a>`:`<a class="nx" href="#/">🏁 إلى الخريطة</a>`}</div>`;scrollTo(0,0);prog()}
function done(n){const d=store.get();if(!d.includes(n))d.push(n);store.set(d);prog();toast(d.length===D.length?'🎉 أحسنت! أنهيتَ الرحلةَ كلَّها':'رائع! 🌟 انتقلْ إلى المحطّةِ التالية');if(n<D.length)setTimeout(()=>location.hash='#/'+(n+1),900)}
function route(){const p=location.hash.replace(/^#\/?/,'').split('/');p[0]?step(+p[0],p[1]):home()}
addEventListener('hashchange',route);route();
</script></body></html>
